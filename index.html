<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Show 6 Music Dashboard</title>
  <!-- Load HLS.js to play BBC stream format natively -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000;
      background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 101vh; 
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Dark Overlay */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .clock {
      font-size: 16vw;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
    }

    .date {
      font-size: 4.5vw;
      font-weight: 300;
      color: #dddddd;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .weather-container {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      padding: 10px 24px;
      border-radius: 40px;
      margin-bottom: 25px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .weather-temp {
      font-size: 3vw;
      font-weight: 600;
    }

    .weather-desc {
      font-size: 2.2vw;
      color: #cccccc;
    }

    /* Audio Control Badge */
    .radio-status {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1.8vw;
      cursor: pointer;
      user-select: none;
    }

    .dot {
      width: 10px;
      height: 10px;
      background-color: #ff3b30;
      border-radius: 50%;
    }

    .dot.playing {
      background-color: #34c759;
      box-shadow: 0 0 8px #34c759;
    }
  </style>
</head>
<body>

  <div class="content-wrapper">
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date">Loading date...</div>
    
    <div class="weather-container">
      <div class="weather-temp" id="temp">--°C</div>
      <div class="weather-desc" id="weather-desc">Loading weather...</div>
    </div>

    <!-- Radio Controls -->
    <div class="radio-status" id="radio-toggle">
      <div class="dot" id="radio-dot"></div>
      <span id="radio-text">Tap screen to Start 6 Music</span>
    </div>
  </div>

  <audio id="radio-stream" playsinline></audio>

  <script>
    // --- Clock & Date ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-GB', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Weather (Open-Meteo API - Default: Sunderland/UK coordinates) ---
    const LAT = 54.9069;
    const LON = -1.3819;

    const weatherCodes = {
      0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
      45: "Foggy", 48: "Depositing rime fog", 51: "Light drizzle", 53: "Moderate drizzle",
      55: "Dense drizzle", 61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
      71: "Slight snow", 73: "Moderate snow", 75: "Heavy snow", 80: "Rain showers",
      95: "Thunderstorm"
    };

    async function fetchWeather() {
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true`);
        const data = await response.json();
        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;

        document.getElementById('temp').textContent = `${temp}°C`;
        document.getElementById('weather-desc').textContent = weatherCodes[code] || "Cloudy";
      } catch (err) {
        document.getElementById('weather-desc').textContent = "Weather unavailable";
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 900000);

    // --- BBC Radio 6 Music HLS Stream ---
    const streamUrl = 'https://as-hls-ww-live.akamaized.net/pool_904/live/ww/bbc_6music/bbc_6music.isml/bbc_6music-audio=320000.m3u8';
    const audio = document.getElementById('radio-stream');
    const radioText = document.getElementById('radio-text');
    const radioDot = document.getElementById('radio-dot');
    let isPlaying = false;

    // Set up HLS stream player
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(audio);
    } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
      audio.src = streamUrl;
    }

    function toggleRadio() {
      if (!isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          radioText.textContent = "BBC Radio 6 Music (Playing)";
          radioDot.classList.add('playing');
        }).catch(err => {
          radioText.textContent = "Tap to retry audio";
        });
      } else {
        audio.pause();
        isPlaying = false;
        radioText.textContent = "BBC Radio 6 Music (Paused)";
        radioDot.classList.remove('playing');
      }
    }

    // --- First Tap Trigger ---
    document.body.addEventListener('click', () => {
      if (!isPlaying) {
        toggleRadio();
      }

      // Request fullscreen mode
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
      else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen().catch(() => {});

      window.scrollTo(0, 10);
    }, { once: true });

    // Allow user to toggle radio on/off anytime by tapping the status bar
    document.getElementById('radio-toggle').addEventListener('click', (e) => {
      e.stopPropagation(); // prevent triggering body click
      toggleRadio();
    });
  </script>
</body>
</html>
