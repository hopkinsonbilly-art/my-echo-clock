<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Show Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* 101vh creates just enough scroll space for Silk to retract the top bar */
      min-height: 101vh; 
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }
    .clock {
      font-size: 11vw;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
    }
    .date {
      font-size: 3.5vw;
      font-weight: 300;
      color: #aaaaaa;
      margin-top: 10px;
      margin-bottom: 25px;
    }
    .weather-container {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255, 255, 255, 0.08);
      padding: 12px 28px;
      border-radius: 40px;
    }
    .weather-temp {
      font-size: 3vw;
      font-weight: 600;
    }
    .weather-desc {
      font-size: 2.2vw;
      color: #cccccc;
    }
  </style>
</head>
<body>

  <div class="clock" id="clock">00:00</div>
  <div class="date" id="date">Loading date...</div>
  
  <div class="weather-container">
    <div class="weather-temp" id="temp">--°C</div>
    <div class="weather-desc" id="weather-desc">Loading weather...</div>
  </div>

  <!-- Keep-Alive Silent Audio -->
  <audio id="silent-audio" loop playsinline src="https://raw.githubusercontent.com/anron/silence-mp3/master/silence-10sec.mp3"></audio>

  <script>
    // --- Clock & Date ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-GB', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Weather (Open-Meteo API) ---
    const LAT = 54.9045; 
    const LON = -1.3825;

    const weatherCodes = {
      0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
      45: "Foggy", 48: "Depositing rime fog", 51: "Light drizzle", 53: "Moderate drizzle",
      55: "Dense drizzle", 61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
      71: "Slight snow", 73: "Moderate snow", 75: "Heavy snow", 80: "Rain showers",
      95: "Thunderstorm"
    };

    async function fetchWeather() {
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true`);
        const data = await response.json();
        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;

        document.getElementById('temp').textContent = `${temp}°C`;
        document.getElementById('weather-desc').textContent = weatherCodes[code] || "Cloudy";
      } catch (err) {
        document.getElementById('weather-desc').textContent = "Weather unavailable";
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 900000);

    // --- Tap Event: Request Fullscreen & Start Silent Audio ---
    document.body.addEventListener('click', () => {
      // Start audio
      const audio = document.getElementById('silent-audio');
      audio.play().catch(() => {});

      // Request browser fullscreen mode
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen().catch(() => {});
      } else if (docEl.webkitRequestFullscreen) {
        docEl.webkitRequestFullscreen().catch(() => {});
      }

      // Scroll down slightly to trigger Silk address bar autohide
      window.scrollTo(0, 10);
    }, { once: true });
  </script>
</body>
</html>
