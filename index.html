<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Show Sunderland Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh; 
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      padding: 10px 16px;
      position: relative;
    }

    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .location-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.1vw;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .green-dot {
      width: 8px;
      height: 8px;
      background-color: #2ed573;
      border-radius: 50%;
    }

    .fullscreen-btn {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.1vw;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s;
    }

    .fullscreen-btn.active {
      background: rgba(46, 213, 115, 0.3);
      border-color: #2ed573;
    }

    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 2;
    }

    .clock {
      font-size: 18vw;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.9;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .date {
      font-size: 2.8vw;
      font-weight: 400;
      color: #ffffff;
      margin-top: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .weather-bar {
      width: 98%;
      max-width: 1100px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

      display: flex;
      align-items: center;
      gap: 12px;
    }
