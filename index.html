<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Show Sunderland Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0f172a;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh; 
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      padding: 10px 16px;
      position: relative;
      transition: background-image 1s ease-in-out;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .location-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.1vw;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .green-dot {
      width: 8px;
      height: 8px;
      background-color: #2ed573;
      border-radius: 50%;
    }

    .fullscreen-btn {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.1vw;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s;
    }

    .fullscreen-btn.active {
      background: rgba(46, 213, 115, 0.3);
      border-color: #2ed573;
    }

    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 2;
    }

    .clock {
      font-size: 18vw;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.9;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .date {
      font-size: 2.8vw;
      font-weight: 400;
      color: #ffffff;
      margin-top: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .weather-bar {
      width: 98%;
      max-width: 1100px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .weather-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .weather-icon {
      font-size: 3.2vw;
      line-height: 1;
    }

    .temp-group {
      display: flex;
      flex-direction: column;
    }

    .current-temp {
      font-size: 3.2vw;
      font-weight: 700;
      line-height: 1;
    }

    .weather-desc {
      font-size: 1.2vw;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .weather-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .stat-label {
      font-size: 1.1vw;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 2vw;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="location-badge">
      <div class="green-dot"></div>
      SUNDERLAND
    </div>
    <button class="fullscreen-btn" id="fs-btn">🔴 TAP TO LOCK DISPLAY</button>
  </div>

  <div class="center-container">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">Loading date...</div>
  </div>

  <div class="weather-bar">
    <div class="weather-left">
      <div class="weather-icon" id="weather-icon">☀️</div>
      <div class="temp-group">
        <div class="current-temp" id="temp">--°C</div>
        <div class="weather-desc" id="weather-desc">LOADING</div>
      </div>
    </div>

    <div class="weather-right">
      <div class="stat-box">
        <div class="stat-label">☔ RAIN AT</div>
        <div class="stat-value" id="rain-time">--:--</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">HIGH / LOW</div>
        <div class="stat-value" id="high-low">--°/--°</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">HUMIDITY</div>
        <div class="stat-value" id="humidity">--%</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">WIND</div>
        <div class="stat-value" id="wind">-- km/h</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">☀️ SUNRISE</div>
        <div class="stat-value" id="sunrise">--:--</div>
      </div>
    </div>
  </div>

  <audio id="silent-audio" loop playsinline src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    const dayBg = "day.jpg";
    const nightBg = "night.jpg";
    let activeBgFile = "";

    // Default daylight thresholds in minutes from midnight (07:00 and 18:00)
    let sunriseMinutes = 420;
    let sunsetMinutes = 1080;

    function updateBackground() {
      const now = new Date();
      const currentMinutes = (now.getHours() * 60) + now.getMinutes();
      
      const isDay = currentMinutes >= sunriseMinutes && currentMinutes < sunsetMinutes;
      const targetBg = isDay ? dayBg : nightBg;
      
      if (activeBgFile !== targetBg) {
        activeBgFile = targetBg;
        document.body.style.backgroundImage = `url('${targetBg}?v=${Date.now()}')`;
      }
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-GB', options);

      updateBackground();
    }

    setInterval(updateClock, 1000);
    updateClock();

    const LAT = 54.9069;
    const LON = -1.3819;

    const weatherIcons = {
      0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️",
      45: "🌫️", 48: "🌫️", 51: "🌧️", 53: "🌧️",
      55: "🌧️", 61: "🌧️", 63: "🌧️", 65: "🌧️",
      71: "❄️", 73: "❄️", 75: "❄️", 80: "🌦️",
      95: "🌩️"
    };

    const weatherCodes = {
      0: "CLEAR SKY", 1: "MAINLY CLEAR", 2: "PARTLY CLOUDY", 3: "OVERCAST",
      45: "FOGGY", 48: "RIME FOG", 51: "LIGHT DRIZZLE", 53: "MODERATE DRIZZLE",
      55: "DENSE DRIZZLE", 61: "SLIGHT RAIN", 63: "MODERATE RAIN", 65: "HEAVY RAIN",
      71: "SLIGHT SNOW", 73: "MODERATE SNOW", 75: "HEAVY SNOW", 80: "RAIN SHOWERS",
      95: "THUNDERSTORM"
    };

    async function fetchWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&hourly=precipitation_probability,relativehumidity_2m&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Europe%2FLondon`;
        const response = await fetch(url);
        if (!response.ok) throw new Error("Weather network error");
        const data = await response.json();

        if (data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          const code = data.current_weather.weathercode;
          document.getElementById('temp').textContent = `${temp}°C`;
          document.getElementById('weather-desc').textContent = weatherCodes[code] || "CLOUDY";
          document.getElementById('weather-icon').textContent = weatherIcons[code] || "☁️";

          const wind = Math.round(data.current_weather.windspeed);
          document.getElementById('wind').textContent = `${wind} km/h`;
        }

        if (data.daily && data.daily.temperature_2m_max && data.daily.temperature_2m_min) {
          const high = Math.round(data.daily.temperature_2m_max[0]);
          const low = Math.round(data.daily.temperature_2m_min[0]);
          document.getElementById('high-low').textContent = `${high}°/${low}°`;
        }

        const currentHour = new Date().getHours();
        if (data.hourly && data.hourly.relativehumidity_2m) {
          const humidity = data.hourly.relativehumidity_2m[currentHour] ?? data.hourly.relativehumidity_2m[0] ?? "--";
          document.getElementById('humidity').textContent = `${humidity}%`;
        }

        if (data.hourly && data.hourly.precipitation_probability) {
          const precipProbs = data.hourly.precipitation_probability;
          let rainHourText = "NONE";
          for (let i = currentHour; i < currentHour + 24; i++) {
            if (precipProbs[i] > 30) {
              const h = i % 24;
              rainHourText = `${String(h).padStart(2, '0')}:00`;
              break;
            }
          }
          document.getElementById('rain-time').textContent = rainHourText;
        }

        if (data.daily && data.daily.sunrise && data.daily.sunrise[0]) {
          const sunriseStr = data.daily.sunrise[0].split("T")[1];
          document.getElementById('sunrise').textContent = sunriseStr;
          const [sH, sM] = sunriseStr.split(":").map(Number);
          sunriseMinutes = (sH * 60) + sM;
        }

        if (data.daily && data.daily.sunset && data.daily.sunset[0]) {
          const sunsetStr = data.daily.sunset[0].split("T")[1];
          const [ssH, ssM] = sunsetStr.split(":").map(Number);
          sunsetMinutes = (ssH * 60) + ssM;
        }

        updateBackground();

      } catch (err) {
        console.error("Weather fetch failed:", err);
        document.getElementById('weather-desc').textContent = "UNAVAILABLE";
      }
    }

    fetchWeather();
    setInterval(fetchWeather, 900000);

    const audio = document.getElementById('silent-audio');
    const btn = document.getElementById('fs-btn');

    function activateKeepAlive() {
      audio.play().then(() => {
        btn.textContent = "🟢 DISPLAY LOCKED (ACTIVE)";
        btn.classList.add('active');
      }).catch((err) => {
        btn.textContent = "⚠️ TAP AGAIN TO LOCK";
      });

      const docEl = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
        else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen().catch(() => {});
      }
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      activateKeepAlive();
    });

    document.body.addEventListener('click', () => {
      activateKeepAlive();
    }, { once: true });
  </script>
</body>
</html>
