<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Show Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 101vh; 
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      transition: background-image 1s ease-in-out;
    }

    /* Dark Tint Overlay to Keep Text Crisp */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .clock {
      font-size: 16vw;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
    }

    .date {
      font-size: 4.5vw;
      font-weight: 300;
      color: #dddddd;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .weather-container {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      padding: 12px 30px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .weather-temp {
      font-size: 3.5vw;
      font-weight: 600;
    }

    .weather-desc {
      font-size: 2.5vw;
      color: #e0e0e0;
    }
  </style>
</head>
<body>

  <div class="content-wrapper">
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date">Loading date...</div>
    
    <div class="weather-container">
      <div class="weather-temp" id="temp">--°C</div>
      <div class="weather-desc" id="weather-desc">Loading weather...</div>
    </div>
  </div>

  <!-- Keep-Alive Silent Audio Track -->
  <audio id="silent-audio" loop playsinline src="https://raw.githubusercontent.com/anron/silence-mp3/master/silence-10sec.mp3"></audio>

  <script>
    // --- Day / Night Background Logic ---
    const dayBg = "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80";
    const nightBg = "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80";

    function updateBackground() {
      const hour = new Date().getHours();
      // Daytime: 6 AM (6) to 7:59 PM (19)
      const isDay = hour >= 6 && hour < 20;
      const targetBg = isDay ? dayBg : nightBg;
      
      document.body.style.backgroundImage = `url('${targetBg}')`;
    }

    // --- Clock & Date ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-GB', options);
      
      updateBackground();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Weather (Open-Meteo API) ---
    const LAT = 54.9069;
    const LON = -1.3819;

    const weatherCodes = {
      0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
      45: "Foggy", 48: "Depositing rime fog", 51: "Light drizzle", 53: "Moderate drizzle",
      55: "Dense drizzle", 61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
      71: "Slight snow", 73: "Moderate snow", 75: "Heavy snow", 80: "Rain showers",
      95: "Thunderstorm"
    };

    async function fetchWeather() {
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true`);
        const data = await response.json();
        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;

        document.getElementById('temp').textContent = `${temp}°C`;
        document.getElementById('weather-desc').textContent = weatherCodes[code] || "Cloudy";
      } catch (err) {
        document.getElementById('weather-desc').textContent = "Weather unavailable";
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 900000);

    // --- First Tap Trigger: Fullscreen + Silent Audio Start ---
    document.body.addEventListener('click', () => {
      const audio = document.getElementById('silent-audio');
      audio.play().catch(() => {});

      const docEl = document.documentElement;
      if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
      else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen().catch(() => {});

      window.scrollTo(0, 10);
    }, { once: true });
  </script>
</body>
</html>
