<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Show Sunderland Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0f172a;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh; 
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      padding: 10px 16px;
      position: relative;
      transition: background-image 1s ease-in-out;
    }

    /* Dark Tint Overlay */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    /* Header Bar */
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .location-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.1vw;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .green-dot {
      width: 8px;
      height: 8px;
      background-color: #2ed573;
      border-radius: 50%;
    }

    /* Top Right Lock / Fullscreen Button */
    .fullscreen-btn {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.1vw;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s;
    }

    .fullscreen-btn.active {
      background: rgba(46, 213, 115, 0.3);
      border-color: #2ed573;
    }

    /* Center Time & Date Container */
    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 2;
    }

    .clock {
      font-size: 18vw;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.9;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .date {
      font-size: 2.8vw;
      font-weight: 400;
      color: #ffffff;
      margin-top: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    /* Bottom Weather Info Bar */
    .weather-bar {
      width: 98%;
      max-width: 1100px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .weather-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .weather-icon {
      font-size: 3.2vw;
      line-height: 1;
    }

    .temp-group {
      display: flex;
      flex-direction: column;
    }

    .current-temp {
      font-size: 3.2vw;
      font-weight: 700;
      line-height: 1;
    }

    .weather-desc {
      font-size: 1.2vw;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .weather-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .stat-label {
      font-size: 1.1vw;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 2vw;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Header Bar -->
  <div class="header-bar">
    <div class="location-badge">
      <div class="green-dot"></div>
      SUNDERLAND
    </div>
    <button class="fullscreen-btn" id="fs-btn">🔴 TAP TO LOCK DISPLAY</button>
  </div>

  <!-- Center Container -->
  <div class="center-container">
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date">--</div>
  </div>

  <!-- Bottom Weather Widget -->
  <div class="weather-bar">
    <div class="weather-left">
      <div class="weather-icon" id="weather-icon">☀️</div>
      <div class="temp-group">
        <div class="current-temp" id="temp">--°C</div>
        <div class="weather-desc" id="weather-desc">LOADING</div>
      </div>
    </div>

    <div class="weather-right">
      <div class="stat-box">
        <div class="stat-label">☔ RAIN AT</div>
        <div class="stat-value" id="rain-time">--:--</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">HIGH / LOW</div>
        <div class="stat-value" id="high-low">--°/--°</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">HUMIDITY</div>
        <div class="stat-value" id="humidity">--%</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">WIND</div>
        <div class="stat-value" id="wind">-- km/h</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">☀️ SUNRISE</div>
        <div class="stat-value" id="sunrise">--:--</div>
      </div>
    </div>
  </div>

  <!-- Embedded Base64 Silent Audio Stream -->
  <audio id="silent-audio" loop playsinline src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    // --- Immediate Clock Update ---
    function updateClock() {
      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      if (hours < 10) hours = "0" + hours;
      if (minutes < 10) minutes = "0" + minutes;

      var clockEl = document.getElementById('clock');
      if (clockEl) clockEl.innerText = hours + ":" + minutes;

      var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      
      var dateEl = document.getElementById('date');
      if (dateEl) {
        dateEl.innerText = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
      }

      // Background Gradient Fallback
      var isDay = hours >= 6 && hours < 20;
      document.body.style.backgroundImage = isDay 
        ? "linear-gradient(135deg, #1e3a8a, #0f172a), url('day.jpg')" 
        : "linear-gradient(135deg, #020617, #0f172a), url('night.jpg')";
    }

    // Run clock immediately without waiting for DOM events
    updateClock();
    setInterval(updateClock, 1000);

    // --- Weather Codes & Icons ---
    var weatherIcons = { 0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️", 45: "🌫️", 48: "🌫️", 51: "🌧️", 53: "🌧️", 55: "🌧️", 61: "🌧️", 63: "🌧️", 65: "🌧️", 71: "❄️", 73: "❄️", 75: "❄️", 80: "🌦️", 95: "🌩️" };
    var weatherCodes = { 0: "CLEAR SKY", 1: "MAINLY CLEAR", 2: "PARTLY CLOUDY", 3: "OVERCAST", 45: "FOGGY", 48: "RIME FOG", 51: "LIGHT DRIZZLE", 53: "MODERATE DRIZZLE", 55: "DENSE DRIZZLE", 61: "SLIGHT RAIN", 63: "MODERATE RAIN", 65: "HEAVY RAIN", 71: "SLIGHT SNOW", 73: "MODERATE SNOW", 75: "HEAVY SNOW", 80: "RAIN SHOWERS", 95: "THUNDERSTORM" };

    // --- Fetch Weather Function with Fallback ---
    function fetchWeather() {
      var LAT = 54.9069;
      var LON = -1.3819;
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON + "&current_weather=true&hourly=precipitation_probability,relativehumidity_2m&daily=temperature_2m_max,temperature_2m_min,sunrise&timezone=Europe%2FLondon";

      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 400) {
          try {
            var data = JSON.parse(xhr.responseText);

            if (data && data.current_weather) {
              var temp = Math.round(data.current_weather.temperature);
              var code = data.current_weather.weathercode;
              document.getElementById('temp').innerText = temp + "°C";
              document.getElementById('weather-desc').innerText = weatherCodes[code] || "CLOUDY";
              document.getElementById('weather-icon').innerText = weatherIcons[code] || "☁️";
              document.getElementById('wind').innerText = Math.round(data.current_weather.windspeed) + " km/h";
            }

            if (data && data.daily) {
              if (data.daily.temperature_2m_max && data.daily.temperature_2m_min) {
                var high = Math.round(data.daily.temperature_2m_max[0]);
                var low = Math.round(data.daily.temperature_2m_min[0]);
                document.getElementById('high-low').innerText = high + "°/" + low + "°";
              }
              if (data.daily.sunrise && data.daily.sunrise[0]) {
                var parts = data.daily.sunrise[0].split("T");
                if (parts[1]) document.getElementById('sunrise').innerText = parts[1];
              }
            }

            var currentHour = new Date().getHours();
            if (data && data.hourly) {
              if (data.hourly.relativehumidity_2m) {
                var val = data.hourly.relativehumidity_2m[currentHour];
                document.getElementById('humidity').innerText = (val !== undefined ? val : "--") + "%";
              }
              if (data.hourly.precipitation_probability) {
                var probs = data.hourly.precipitation_probability;
                var rainHourText = "NONE";
                for (var i = currentHour; i < currentHour + 24; i++) {
                  if (probs[i] && probs[i] > 30) {
                    var h = i % 24;
                    rainHourText = (h < 10 ? "0" + h : h) + ":00";
                    break;
                  }
                }
                document.getElementById('rain-time').innerText = rainHourText;
              }
            }
          } catch(e) {
            document.getElementById('weather-desc').innerText = "UNAVAILABLE";
          }
        }
      };
      xhr.onerror = function() {
        document.getElementById('weather-desc').innerText = "OFFLINE";
      };
      xhr.send();
    }

    fetchWeather();
    setInterval(fetchWeather, 900000);

    // --- Audio Keep-Alive & Fullscreen Controller ---
    var audio = document.getElementById('silent-audio');
    var btn = document.getElementById('fs-btn');

    function activateKeepAlive() {
      if (audio) {
        audio.play().then(function() {
          if (btn) {
            btn.innerText = "🟢 DISPLAY LOCKED (ACTIVE)";
            btn.classList.add('active');
          }
        }).catch(function() {
          if (btn) btn.innerText =
