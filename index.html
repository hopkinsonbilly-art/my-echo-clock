<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Show Sunderland Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0b1329;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh; 
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      padding: 10px 16px;
      position: relative;
    }

    /* Dark Overlay for Text Readability */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .location-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.1vw;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .green-dot {
      width: 8px;
      height: 8px;
      background-color: #2ed573;
      border-radius: 50%;
    }

    .fullscreen-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.1vw;
      font-weight: 700;
      cursor: pointer;
    }

    .fullscreen-btn.active {
      background: rgba(46, 213, 115, 0.35);
      border-color: #2ed573;
      color: #ffffff;
    }

    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 2;
    }

    .clock {
      font-size: 18vw;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.9;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .date {
      font-size: 2.8vw;
      font-weight: 400;
      color: #ffffff;
      margin-top: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .weather-bar {
      width: 98%;
      max-width: 1100px;
      background: rgba(15, 23, 42, 0.75);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .weather-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .weather-icon {
      font-size: 3.2vw;
      line-height: 1;
    }

    .temp-group {
      display: flex;
      flex-direction: column;
    }

    .current-temp {
      font-size: 3.2vw;
      font-weight: 700;
      line-height: 1;
    }

    .weather-desc {
      font-size: 1.2vw;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .weather-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .stat-label {
      font-size: 1.1vw;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 2vw;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="location-badge">
      <div class="green-dot"></div>
      SUNDERLAND
    </div>
    <button class="fullscreen-btn" id="fs-btn">🔴 TAP TO LOCK DISPLAY</button>
  </div>

  <div class="center-container">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">Loading...</div>
  </div>

  <div class="weather-bar">
    <div class="weather-left">
      <div class="weather-icon" id="weather-icon">☀️</div>
      <div class="temp-group">
        <div class="current-temp" id="temp">--°C</div>
        <div class="weather-desc" id="weather-desc">LOADING</div>
      </div>
    </div>

    <div class="weather-right">
      <div class="stat-box">
        <div class="stat-label">☔ RAIN AT</div>
        <div class="stat-value" id="rain-time">--:--</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">HIGH / LOW</div>
        <div class="stat-value" id="high-low">--°/--°</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">HUMIDITY</div>
        <div class="stat-value" id="humidity">--%</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">WIND</div>
        <div class="stat-value" id="wind">-- km/h</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">☀️ SUNRISE</div>
        <div class="stat-value" id="sunrise">--:--</div>
      </div>
    </div>
  </div>

  <audio id="silent-audio" loop playsinline src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    function renderTime() {
      var d = new Date();
      var h = d.getHours();
      var m = d.getMinutes();
      if (h < 10) { h = "0" + h; }
      if (m < 10) { m = "0" + m; }
      
      var c = document.getElementById('clock');
      if (c) { c.innerHTML = h + ":" + m; }

      var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      var dt = document.getElementById('date');
      if (dt) { dt.innerHTML = days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()]; }

      var isDay = h >= 6 && h < 19;
      var imgName = isDay ? "day.jpg" : "night.jpg";
      document.body.style.backgroundImage = "url('./" + imgName + "')";
    }

    renderTime();
    setInterval(renderTime, 1000);

    var wIcons = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌧️",53:"🌧️",55:"🌧️",61:"🌧️",63:"🌧️",65:"🌧️",71:"❄️",73:"❄️",75:"❄️",80:"🌦️",95:"🌩️"};
    var wCodes = {0:"CLEAR SKY",1:"MAINLY CLEAR",2:"PARTLY CLOUDY",3:"OVERCAST",45:"FOGGY",48:"RIME FOG",51:"LIGHT DRIZZLE",53:"MODERATE DRIZZLE",55:"DENSE DRIZZLE",61:"SLIGHT RAIN",63:"MODERATE RAIN",65:"HEAVY RAIN",71:"SLIGHT SNOW",73:"MODERATE SNOW",75:"HEAVY SNOW",80:"RAIN SHOWERS",95:"THUNDERSTORM"};

    function parseWeatherData(res) {
      if (!res) return;
      
      if (res.current_weather) {
        document.getElementById('temp').innerHTML = Math.round(res.current_weather.temperature) + "°C";
        document.getElementById('weather-desc').innerHTML = wCodes[res.current_weather.weathercode] || "CLOUDY";
        document.getElementById('weather-icon').innerHTML = wIcons[res.current_weather.weathercode] || "☁️";
        document.getElementById('wind').innerHTML = Math.round(res.current_weather.windspeed) + " km/h";
      }

      if (res.daily && res.daily.temperature_2m_max && res.daily.temperature_2m_min) {
        document.getElementById('high-low').innerHTML = Math.round(res.daily.temperature_2m_max[0]) + "°/" + Math.round(res.daily.temperature_2m_min[0]) + "°";
      }

      if (res.daily && res.daily.sunrise && res.daily.sunrise[0]) {
        var s = res.daily.sunrise[0].split("T");
        if (s[1]) document.getElementById('sunrise').innerHTML = s[1];
      }

      if (res.hourly) {
        var hr = new Date().getHours();
        if (res.hourly.relativehumidity_2m) {
          document.getElementById('humidity').innerHTML = (res.hourly.relativehumidity_2m[hr] || "--") + "%";
        }

        if (res.hourly.precipitation_probability) {
          var p = res.hourly.precipitation_probability;
          var r = "NONE";
          for (var idx = hr; idx < hr + 24; idx++) {
            if (p[idx] && p[idx] > 30) {
              var x = idx % 24;
              r = (x < 10 ? "0" + x : x) + ":00";
              break;
            }
          }
          document.getElementById('rain-time').innerHTML = r;
        }
      }
    }

    // Dynamic iframe worker bypass for strict Silk MyPage webview containers
    function fetchWeather() {
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      document.body.appendChild(iframe);

      var url = "https://api.open-meteo.com/v1/forecast?latitude=54.9069&longitude=-1.3819&current_weather=true&hourly=precipitation_probability,relativehumidity_2m&daily=temperature_2m_max,temperature_2m_min,sunrise&timezone=Europe%2FLondon";

      var doc = iframe.contentWindow.document;
      doc.open();
      doc.write('<script>var xhr = new XMLHttpRequest(); xhr.open("GET", "' + url + '", true); xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { window.parent.postMessage(xhr.responseText, "*"); } }; xhr.send();<\/script>');
      doc.close();

      window.addEventListener('message', function(event) {
        try {
          var data = JSON.parse(event.data);
          parseWeatherData(data);
          if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe);
        } catch(e) {}
      }, { once: true });
    }

    fetchWeather();
    setInterval(fetchWeather, 900000);

    var audio = document.getElementById('silent-audio');
    var btn = document.getElementById('fs-btn');

    function lockDisplay() {
      if (audio) {
        audio.play().then(function() {
          if (btn) {
            btn.innerHTML = "🟢 DISPLAY LOCKED";
            btn.className = "fullscreen-btn active";
          }
        }).catch(function() {
          if (btn) { btn.innerHTML = "⚠️ TAP AGAIN"; }
        });
      }
    }

    if (btn) {
      btn.onclick = function(e) {
        if (e && e.stopPropagation) { e.stopPropagation(); }
        lockDisplay();
      };
    }

    document.body.onclick = function() {
      lockDisplay();
    };
  </script>
</body>
</html>
