<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Show Sunderland Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0f172a;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh; 
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      padding: 10px 16px;
      position: relative;
      transition: background-image 1s ease-in-out;
    }

    /* Dark Tint Overlay */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    /* Header Bar */
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .location-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.1vw;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .green-dot {
      width: 8px;
      height: 8px;
      background-color: #2ed573;
      border-radius: 50%;
    }

    /* Top Right Lock / Fullscreen Button */
    .fullscreen-btn {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.1vw;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s;
    }

    .fullscreen-btn.active {
      background: rgba(46, 213, 115, 0.3);
      border-color: #2ed573;
    }

    /* Center Time & Date Container */
    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 2;
    }

    .clock {
      font-size: 18vw;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.9;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .date {
      font-size: 2.8vw;
      font-weight: 400;
      color: #ffffff;
      margin-top: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    /* Bottom Weather Info Bar */
    .weather-bar {
      width: 98%;
      max-width: 1100px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .weather-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .weather-icon {
      font-size: 3.2vw;
      line-height: 1;
    }

    .temp-group {
      display: flex;
      flex-direction: column;
    }

    .current-temp {
      font-size: 3.2vw;
      font-weight: 700;
      line-height: 1;
    }

    .weather-desc {
      font-size: 1.2vw;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .weather-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .stat-label {
      font-size: 1.1vw;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 2vw;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Header Bar -->
  <div class="header-bar">
    <div class="location-badge">
      <div class="green-dot"></div>
      SUNDERLAND
    </div>
    <button class="fullscreen-btn" id="fs-btn">🔴 TAP TO LOCK DISPLAY</button>
  </div>

  <!-- Center Container -->
  <div class="center-container">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">--</div>
  </div>

  <!-- Bottom Weather Widget -->
  <div class="weather-bar">
    <div class="weather-left">
      <div class="weather-icon" id="weather-icon">☀️</div>
      <div class="temp-group">
        <div class="current-temp" id="temp">--°C</div>
        <div class="weather-desc" id="weather-desc">LOADING</div>
      </div>
    </div>

    <div class="weather-right">
      <div class="stat-box">
        <div class="stat-label">☔ RAIN AT</div>
        <div class="stat-value" id="rain-time">--:--</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">HIGH / LOW</div>
        <div class="stat-value" id="high-low">--°/--°</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">HUMIDITY</div>
        <div class="stat-value" id="humidity">--%</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">WIND</div>
        <div class="stat-value" id="wind">-- km/h</div>
      </div>

      <div class="stat-box">
        <div class="stat-label">☀️ SUNRISE</div>
        <div class="stat-value" id="sunrise">--:--</div>
